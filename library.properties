sentence=A scrubber for the Teensy Audio Library: it plays a sound file the way a record plays under a hand.
paragraph=AudioPlayScrub plays a raw sound file from the SD card through a playhead that goes after a target. Scrubbed, the playhead goes a set part of the way to where the sound is wanted each sample, so it races there while it is far and slows as it arrives, its pitch following its speed, and is silent at rest. Played, the sound runs at any speed from five times forwards to five times backwards, round and round the file. The file is never in memory whole: the sketch lends a window of RAM and the scrubber reads the card about the playhead. The playhead (sb::Playhead) is plain C++, reads between samples through a cubic, keeps its place in doubles however long the file, and is tested on a computer.
